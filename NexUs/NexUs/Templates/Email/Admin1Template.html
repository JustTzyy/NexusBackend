<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Template</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f4f4f5;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        .wrapper {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        .header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            padding: 36px 40px;
            text-align: center;
        }

        .header h1 {
            margin: 0;
            color: #ffffff;
            font-size: 22px;
            font-weight: 700;
        }

        .header p {
            margin: 6px 0 0;
            color: #bfdbfe;
            font-size: 13px;
        }

        .body {
            padding: 36px 40px;
        }

        .greeting {
            font-size: 16px;
            color: #1e293b;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .intro {
            font-size: 14px;
            color: #475569;
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .footer {
            background: #f8fafc;
            border-top: 1px solid #e2e8f0;
            padding: 20px 40px;
            text-align: center;
        }

        .footer p {
            margin: 0;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="header">
            <h1>{{CompanyName}}</h1>
            <p>Email Notification</p>
        </div>
        <div class="body">
            <p class="greeting">Hello, {{RecipientName}}!</p>
            <p class="intro">
                Helloo
            </p>
        </div>
        <div class="footer">
            <p>&copy; {{Year}} {{CompanyName}}. All rights reserved.</p>
        </div>
    </div>
</body>
</html>
